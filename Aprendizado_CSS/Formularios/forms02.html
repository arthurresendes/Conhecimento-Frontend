<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            background: #644d87 url(fundo.jpg) no-repeat top center;
        }

        #container {
            width: 400px;
            height: 300px;
            background-color: rgba(255, 255, 255, 0.3);
            -webkit-border-radius: 10px;
            -moz-border-radius: 10px;
            border-radius: 10px;
            margin: 0 auto;
            margin-top: 120px;
            text-align: center;
        }

        #container img {
            width: 120px;
            height: 120px;
            margin-top: -60px;
            margin-bottom: 30px;
        }

        input {
            height: 40px;
            width: 80%;
            margin-bottom: 10px;
            background-color: white;
            margin-bottom: 10px;
            padding-left: 40px;
            border: none;
            background-repeat: no-repeat;
            background-position: 10px;
            border: 2px solid transparent;
            /* Adiciona borda "invisível" por padrão */
            transition: border-color 0.3s ease;
        }

        input.email {
            background-image: url(icone-usuario.png);
        }

        input.senha {
            background-image: url(icone-cadeado.png);
        }

        input.enviar {
            background-color: #f79300;
            border-radius: 10px;
            color: white;
            border: 2px solid #db7d00;
            padding: 5px 20px;
            height: 45px;
            width: 90%;
            font-size: 20px;
            background-image: linear-gradient(to bottom, #faa600, #f68a00)
        }

        input.enviar:hover {
            background-image: linear-gradient(to bottom, #f68a00, #faa600);
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="container">
        <img src="perfil.png" alt="Perfil">

        <form action="">

            <div>
                <input class="email" type="email" name="email" id="email" placeholder="Digite seu e-mail">
            </div>
            <div>
                <input class="senha" type="password" name="senha" id="senha" placeholder="Digite sua senha">
            </div>

            <div>
                <input class="enviar" type="submit" value="Logar">
            </div>
        </form>
    </div>
</body>

</html>
